<title>/*APP_TITLE*/</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&family=Patrick+Hand&display=swap">
<style>/*GUIDECSS*/</style>
<style>
/* Layout: a game-style path of lesson bubbles per lecture; lessons play full-screen one idea at a time with a big thumb-reach Next button. */
:root{
  --pg:#f3f6fb; --card:#ffffff; --ink2:#1b2433; --soft:#5a6576; --rule:#dde3ee;
  --go:#16a34a; --go-ink:#ffffff; --star:#f5a524; --miss:#e11d48;
  --u5:#0e8fb0; --u6:#e08a00; --u7:#7c4ddb; --u8:#14a06a; --u9:#e4572e; --u10:#2f6fe4; --u11:#d6338a;
  --f-play:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-read:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --pg:#0f1520; --card:#18212f; --ink2:#e8edf5; --soft:#a3adbd; --rule:#2a3546;
  --go:#22c55e; --go-ink:#06260f; --star:#fbbf24; --miss:#fb7185;
  --u5:#38bdf8; --u6:#fbbf24; --u7:#a78bfa; --u8:#34d399; --u9:#fb8a63; --u10:#7aa7ff; --u11:#f472b6; color-scheme:dark }}
:root[data-theme="dark"]{
  --pg:#0f1520; --card:#18212f; --ink2:#e8edf5; --soft:#a3adbd; --rule:#2a3546;
  --go:#22c55e; --go-ink:#06260f; --star:#fbbf24; --miss:#fb7185;
  --u5:#38bdf8; --u6:#fbbf24; --u7:#a78bfa; --u8:#34d399; --u9:#fb8a63; --u10:#7aa7ff; --u11:#f472b6; color-scheme:dark }
html,body{background:var(--pg); color:var(--ink2)}
body{font-family:var(--f-read); font-size:17px; line-height:1.55; margin:0}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:50; background:var(--pg)}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--u5); outline-offset:2px}
.wrapx{max-width:720px; margin:0 auto; padding-block:16px 120px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
h1.app{font-family:var(--f-play); font-weight:800; font-size:clamp(28px,6vw,38px); line-height:1.05; margin:6px 0 4px; letter-spacing:-.01em}
.sub2{color:var(--soft); margin:0 0 14px}

/* top stats */
.stats{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 16px}
.pill{display:flex; align-items:center; gap:6px; background:var(--card); border:2px solid var(--rule); border-radius:999px; padding:6px 12px; font-family:var(--f-play); font-weight:700; font-size:16px}
.pill b{font-variant-numeric:tabular-nums}
.pill svg{width:18px; height:18px; flex:none}
.pill.xp{color:var(--star)} .pill.cd{color:var(--miss)} .pill.done{color:var(--go)}

/* today card */
.today{background:var(--card); border:2px solid var(--rule); border-radius:22px; padding:16px; margin-bottom:22px; box-shadow:0 4px 0 var(--rule)}
.today h2{font-family:var(--f-play); font-size:22px; margin:0 0 2px}
.today .daydesc{color:var(--soft); margin:0 0 10px; font-size:15px}
.days{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin:10px 0 14px}
.day{border-radius:14px; padding:8px 6px; text-align:center; border:2px solid var(--rule); font-size:13px; line-height:1.25}
.day .dn{font-family:var(--f-play); font-weight:800; font-size:15px; display:block}
.day.now{border-color:var(--go); background:color-mix(in srgb, var(--go) 12%, transparent)}
.day .bar{height:6px; border-radius:3px; background:var(--rule); margin-top:6px; overflow:hidden}
.day .bar i{display:block; height:100%; background:var(--go); width:0}
.bigbtn{display:block; width:100%; box-sizing:border-box; border:0; border-radius:16px; padding:14px 18px; font-family:var(--f-play); font-weight:800; font-size:20px; cursor:pointer; background:var(--go); color:var(--go-ink); box-shadow:0 5px 0 color-mix(in srgb, var(--go) 60%, #000); transition:transform .08s}
.bigbtn:active{transform:translateY(3px); box-shadow:0 2px 0 color-mix(in srgb, var(--go) 60%, #000)}
.bigbtn.ghost{background:var(--card); color:var(--ink2); border:2px solid var(--rule); box-shadow:0 4px 0 var(--rule)}
.bigbtn[hidden]{display:none!important}
.today h2,.unit-hd h3{border:0; padding:0}
.tcard{background:var(--card); border:2px solid var(--rule); border-radius:18px; padding:16px 16px 6px; font-size:19px; line-height:1.6}
.tcard ul,.tcard ol{padding-left:22px; margin:0 0 10px}
.tcard li{margin:4px 0}
.bigbtn small{display:block; font-family:var(--f-read); font-weight:400; font-size:14px; opacity:.85}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}

/* units */
.unit{margin:26px 0 8px; border-radius:22px; overflow:hidden; border:2px solid var(--rule); background:var(--card)}
.unit-hd{background:var(--uc); color:#fff; padding:14px 16px; display:flex; gap:12px; align-items:center}
.unit-hd .ring{width:52px; height:52px; flex:none}
.unit-hd h3{font-family:var(--f-play); font-weight:800; font-size:22px; margin:0; line-height:1.1}
.unit-hd p{margin:2px 0 0; font-size:14px; opacity:.92}
.unit-hd .meta{min-width:0}
.badge-mini{margin-left:auto; flex:none; text-align:center; font-family:var(--f-play); font-size:12px; line-height:1.1; opacity:.95}
.badge-mini svg{width:40px; height:40px; display:block; margin:0 auto 2px}
.path{list-style:none; margin:0; padding:14px 10px 18px; display:flex; flex-direction:column; gap:4px}
.node{display:flex; align-items:center; gap:12px; padding:6px 8px; border-radius:16px; cursor:pointer; border:0; background:none; text-align:left; width:100%}
.node:hover{background:color-mix(in srgb, var(--uc) 8%, transparent)}
.node .dot{width:46px; height:46px; border-radius:50%; flex:none; display:grid; place-items:center; font-family:var(--f-play); font-weight:800; font-size:18px; border:3px solid var(--uc); color:var(--uc); background:var(--card); box-shadow:0 4px 0 color-mix(in srgb, var(--uc) 45%, transparent)}
.node.done .dot{background:var(--uc); color:#fff}
.node.next .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.09)}}
@media (prefers-reduced-motion: reduce){ .node.next .dot{animation:none} }
.node .nt{min-width:0}
.node .nt b{display:block; font-weight:700; line-height:1.25}
.node .nt span{font-size:13px; color:var(--soft)}
.node .stars{margin-left:auto; flex:none; color:var(--star); font-size:15px; letter-spacing:1px}
.node:nth-child(4n+2){padding-left:30px} .node:nth-child(4n+3){padding-left:52px} .node:nth-child(4n+4){padding-left:30px}
@media (max-width:420px){ .node:nth-child(4n+2){padding-left:18px} .node:nth-child(4n+3){padding-left:32px} .node:nth-child(4n+4){padding-left:18px} }
.node.boss .dot{border-radius:14px; width:52px; height:52px}
.grouplab{font-family:var(--f-play); font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); padding:10px 8px 0}

/* player */
.player{position:fixed; inset:0; z-index:40; background:var(--pg); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px)}
.player[hidden]{display:none!important}
.ptop{display:flex; align-items:center; gap:10px; padding-block:10px; padding-left:max(12px, env(safe-area-inset-left,0px)); padding-right:max(12px, env(safe-area-inset-right,0px)); max-width:760px; width:100%; margin:0 auto; box-sizing:border-box}
.xbtn{width:40px; height:40px; border-radius:12px; border:2px solid var(--rule); background:var(--card); cursor:pointer; flex:none; display:grid; place-items:center}
.xbtn svg{width:18px; height:18px}
.pbar{cursor:pointer; flex:1; height:14px; border-radius:7px; background:var(--rule); overflow:hidden}
.pbar i{display:block; height:100%; width:0; background:var(--uc); border-radius:7px; transition:width .25s}
.pcount{font-family:var(--f-play); font-weight:700; font-size:14px; color:var(--soft); flex:none; font-variant-numeric:tabular-nums}
.plabel{max-width:760px; width:100%; margin:-4px auto 2px; box-sizing:border-box; padding-left:max(14px, env(safe-area-inset-left,0px)); padding-right:max(14px, env(safe-area-inset-right,0px)); font-family:var(--f-play); font-weight:700; font-size:14px; line-height:1.3; color:var(--uc); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.plabel span{color:var(--soft); font-weight:600}
.pbody{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
.pin{max-width:720px; margin:0 auto; padding-block:6px 30px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.pfoot{padding-block:10px calc(12px + env(safe-area-inset-bottom,0px)); padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); border-top:2px solid var(--rule); background:var(--pg)}
.pfoot .fin{max-width:720px; margin:0 auto; display:flex; gap:10px}
.pfoot .bigbtn{flex:1}
.pfoot .back{flex:0 0 auto; width:auto; padding-inline:18px}
.ltitle{font-family:var(--f-play); font-weight:800; font-size:24px; line-height:1.15; margin:6px 0 2px; text-wrap:balance}
.kick{font-family:var(--f-play); font-weight:700; color:var(--uc); font-size:15px; margin:4px 0 6px}
.tag{display:inline-block; font-family:var(--f-play); font-weight:700; font-size:13px; letter-spacing:.05em; text-transform:uppercase; padding:3px 10px; border-radius:999px; background:color-mix(in srgb, var(--uc) 16%, transparent); color:var(--uc); margin-bottom:8px}
.stage{animation:slidein .22s ease-out}
@keyframes slidein{from{opacity:.4; transform:translateX(14px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){ .stage{animation:none} }
.bigidea{font-family:var(--f-play); font-weight:700; font-size:clamp(22px,4.8vw,28px); line-height:1.3; margin:8px 0}
.stage p{margin:0 0 12px}
.stage .co{margin:4px 0}
.stage figure, .stage .slide, .stage .fig{margin:4px 0}
.stage .tbl{overflow-x:auto}

/* mission checklist */
.mission{background:var(--card); border:2px solid var(--rule); border-radius:18px; padding:14px 14px 8px; margin:12px 0}
.mission h4{font-family:var(--f-play); font-size:18px; margin:0 0 8px}
.chk{display:flex; gap:10px; align-items:flex-start; padding:8px 4px; border-top:1px dashed var(--rule); cursor:pointer}
.chk:first-of-type{border-top:0}
.chk input{appearance:none; -webkit-appearance:none; width:26px; height:26px; border-radius:8px; border:2.5px solid var(--uc); flex:none; margin:1px 0 0; display:grid; place-items:center; cursor:pointer; background:var(--card)}
.chk input:checked{background:var(--go); border-color:var(--go)}
.chk input:checked::after{content:""; width:7px; height:13px; border:solid var(--go-ink); border-width:0 3px 3px 0; transform:rotate(45deg) translate(-1px,-1px)}
.chk input:disabled{opacity:.7; cursor:default}
.skimnote{font-size:14px; color:var(--soft); margin:6px 0 4px}
.nt .hot{font-style:normal; font-weight:700; color:var(--rose); background:var(--rose-soft); border-radius:999px; padding:0 7px; margin-left:4px; white-space:nowrap}
.bd-exam{border-left:3px solid currentColor; padding-left:8px}
.skimnote b{color:var(--ink2)}

/* cloze check */
.qcard{background:var(--card); border:2px solid var(--rule); border-radius:18px; padding:16px; font-size:19px; line-height:1.5}
.blank{display:inline-block; min-width:64px; padding:0 10px; margin:2px; border-radius:10px; border:2px dashed var(--uc); color:var(--uc); font-weight:700; cursor:pointer; background:color-mix(in srgb, var(--uc) 8%, transparent); text-align:center}
.blank.shown{border-style:solid; background:color-mix(in srgb, var(--go) 18%, transparent); border-color:var(--go); color:var(--ink2)}
.qexp{margin-top:12px; font-size:16px; color:var(--ink2); background:color-mix(in srgb, var(--uc) 9%, transparent); border-radius:12px; padding:10px 12px}
.qexp b{color:var(--uc)}
.gm{display:flex; gap:10px; margin-top:12px}
.gm button{flex:1; border-radius:14px; padding:12px; font-family:var(--f-play); font-weight:800; font-size:17px; cursor:pointer; border:2px solid var(--rule); background:var(--card)}
.gm .got{border-color:var(--go); color:var(--go)} .gm .miss{border-color:var(--miss); color:var(--miss)}
.gm .sel.got{background:var(--go); color:var(--go-ink)} .gm .sel.miss{background:var(--miss); color:#fff}
.hint{font-size:14px; color:var(--soft); margin:8px 0 0}
.opts{display:grid; gap:8px; margin-top:12px}
.opt{border:2px solid var(--rule); background:var(--card); border-radius:14px; padding:10px 14px; text-align:left; cursor:pointer; font-size:16px}
.opt.right{border-color:var(--go); background:color-mix(in srgb, var(--go) 16%, transparent)}
.opt.wrong{border-color:var(--miss); background:color-mix(in srgb, var(--miss) 12%, transparent)}

/* reward */
.reward{text-align:center; padding-top:20px}
.reward .big{font-family:var(--f-play); font-weight:800; font-size:clamp(32px,8vw,46px); line-height:1.05; margin:10px 0 6px}
.reward .starsbig{font-size:52px; color:var(--star); letter-spacing:6px; line-height:1}
.reward .xpgain{display:inline-block; font-family:var(--f-play); font-weight:800; font-size:24px; color:var(--star); background:color-mix(in srgb, var(--star) 15%, transparent); border-radius:999px; padding:4px 16px; margin:8px 0}
.reward p{color:var(--soft)} .reward p.big{color:var(--ink2)}
.medal{width:150px; height:150px; margin:0 auto; display:block; filter:drop-shadow(0 8px 0 color-mix(in srgb, var(--uc) 35%, transparent))}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4); opacity:0} to{transform:none; opacity:1}}
@media (prefers-reduced-motion: reduce){ .pop{animation:none} }
#confetti{position:fixed; inset:0; pointer-events:none; z-index:60}
.onepage{text-align:left; margin-top:14px}
.note-sm{font-size:13px; color:var(--soft); text-align:center; margin-top:18px}
.gpop{z-index:70}
.reviewbox{background:var(--card); border:2px solid var(--rule); border-radius:18px; padding:14px; margin:14px 0}
/* Board view: a white Panaboard with four marker colors, same in both themes on purpose */
.bdtoggle{flex:none; height:40px; border-radius:12px; border:2px solid var(--rule); background:var(--card); cursor:pointer; padding:0 12px; font-family:var(--f-play); font-weight:800; font-size:15px; display:flex; align-items:center; gap:6px}
.bdtoggle svg{width:18px; height:18px}
.bdtoggle[aria-pressed="true"]{background:#111; color:#fff; border-color:#111}
.board{--mk:#151515; --mb:#1d4ed8; --mr:#d42020; --mg:#15803d; background:#ffffff; color:var(--mk); border:10px solid #c9ced6; border-radius:10px; box-shadow:inset 0 0 0 2px #e6e9ee, 0 6px 0 #9aa3ae; padding:16px 18px; font-family:"Patrick Hand", "Comic Sans MS", "Segoe Print", cursive; font-size:21px; line-height:1.35; margin:6px 0 14px}
.board *{color:inherit}
.bd-t{border-top:0!important; padding-top:0; font-family:inherit; font-size:30px; line-height:1.1; margin:0 0 10px; border-bottom:3px solid var(--mk); padding-bottom:4px; display:inline-block}
.bd-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px}
@media (max-width:700px){ .bd-grid{grid-template-columns:minmax(0,1fr)} }
.bd-h{font-size:17px; letter-spacing:.12em; margin:10px 0 4px; text-transform:uppercase; text-decoration:underline; text-underline-offset:3px}
.bd-h.b{color:var(--mb)} .bd-h.r{color:var(--mr)} .bd-h.g{color:var(--mg)}
.board ul{margin:0; padding-left:22px} .board li{margin:2px 0}
.bd-g{color:var(--mg)} .bd-r{color:var(--mr)} .bd-b{color:var(--mb)}
.pw{margin:4px 0 14px}
.pw-t{color:var(--mb); font-size:22px; margin:0 0 6px; text-decoration:underline}
.pw ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; align-items:flex-start}
.pw li{border:2.5px solid var(--mk); border-radius:8px; padding:2px 10px; margin:0; background:#fff; max-width:100%}
.pw li + li{margin-top:22px; position:relative}
.pw li + li::before{content:""; position:absolute; left:22px; top:-21px; width:0; height:14px; border-left:2.5px solid var(--mb)}
.pw li + li::after{content:""; position:absolute; left:16px; top:-9px; border:7px solid transparent; border-top:8px solid var(--mb); border-bottom:0}
.pw .side{margin:8px 0 0 4px; font-size:19px}
.bd-skim{font-size:17px; color:#6b7280; margin-top:10px}
.bd-row{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,1.3fr); gap:10px; border-top:1.5px dashed #b5bcc7; padding:5px 0}
@media (max-width:560px){ .bd-row{grid-template-columns:minmax(0,1fr)} }
.bd-tip{font-size:16px; color:#6b7280; margin:2px 0 10px}
.bd-sec{font-size:24px; margin:14px 0 4px; text-decoration:underline; text-underline-offset:4px}
.bd-big{border:3px solid var(--mb); color:var(--mb); border-radius:10px; padding:6px 12px; font-size:24px; margin:8px 0}
.bd-notes{margin:4px 0 8px; padding-left:24px} .bd-notes li{margin:3px 0}
.board strong, .board b{text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px; font-weight:400}
.board em{font-style:normal; color:var(--mb)}
.bd-line{margin:8px 0; padding-left:2px}
.bd-nancy{border-left:4px solid var(--mb); padding-left:10px}
.bd-tblw{overflow-x:auto; margin:8px 0}
.bd-tbl{display:grid; border-top:2.5px solid var(--mk); border-left:2.5px solid var(--mk); min-width:min(100%, 420px)}
.bd-tbl > div{border-right:2.5px solid var(--mk); border-bottom:2.5px solid var(--mk); padding:4px 8px; font-size:19px; line-height:1.3}
.bd-th{color:var(--mb)}
.bd-fig{margin:10px 0} .bd-fig img, .bd-fig svg{max-width:100%; height:auto; max-height:340px; border:2px solid #d5d9df; border-radius:6px; background:#fff; cursor:zoom-in}
.bd-fig svg{cursor:default; min-width:0; width:100%}
.bd-cap{font-size:17px; color:#4b5563; margin:4px 0 0}
.bd-pg{font-size:17px; color:#6b7280; text-decoration:none; display:inline-block; margin-left:6px}
.bd-pager{display:flex; align-items:center; gap:10px; margin:8px 0}
.bd-nav{width:44px; height:44px; border-radius:12px; border:2px solid var(--rule); background:var(--card); font-size:26px; line-height:1; cursor:pointer; font-family:var(--f-play); font-weight:800; flex:none}
.bd-nav:disabled{opacity:.35; cursor:default}
.bd-dots{display:flex; gap:6px; flex-wrap:wrap; flex:1; min-width:0}
.bd-dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--uc); background:transparent; padding:0; cursor:pointer}
.bd-dot.on{background:var(--uc)}
.bd-pc{font-family:var(--f-play); font-weight:700; font-size:14px; color:var(--soft); flex:none}
.bd-jump{display:flex; flex-direction:column; gap:4px; margin:0 0 6px; font-family:var(--f-play); font-weight:700; font-size:14px; color:var(--soft)}
.bd-jump select{font:inherit; font-family:var(--f-read); font-weight:400; font-size:16px; color:var(--ink2); background:var(--card); border:2px solid var(--rule); border-radius:12px; padding:8px 10px; max-width:100%}
.unit-hd .bdlink{display:inline-block; margin-top:6px; font-family:var(--f-play); font-weight:800; font-size:14px; color:#fff; background:rgba(0,0,0,.22); border:0; border-radius:999px; padding:3px 12px; cursor:pointer}
.lb2{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.85); display:grid; place-items:center; padding:16px}
.lb2[hidden]{display:none!important}
.lb2 img{max-width:100%; max-height:90vh; border-radius:8px; background:#fff}

.unit-hd{cursor:pointer; user-select:none}
.unit-hd .chev{width:26px; height:26px; flex:none; margin-left:4px; transition:transform .2s}
.unit.closed .unit-hd .chev{transform:rotate(-90deg)}
.unit-hd:focus-visible{outline:3px solid #fff; outline-offset:-5px}
@media (prefers-reduced-motion: reduce){ .unit-hd .chev{transition:none} }

.savebtn[aria-pressed="true"]{background:var(--star); border-color:var(--star); color:#1b1300}
.savebtn[aria-pressed="true"] svg{fill:currentColor}
@media (max-width:420px){ .bdtoggle .sv-t{display:none} .bdtoggle{padding:0 10px} }
.node .mark{flex:none; color:var(--star); display:grid; place-items:center; margin-left:auto}
.node .mark svg{width:18px; height:18px}
.node .mark + .stars{margin-left:6px}
.savedbox{background:var(--card); border:2px solid var(--star); border-radius:22px; padding:16px; margin:0 0 22px}
.savedbox h2{font-family:var(--f-play); font-size:22px; margin:0; border:0; padding:0; display:flex; align-items:center; gap:8px}
.savedbox h2 span{font-size:14px; background:var(--star); color:#1b1300; border-radius:999px; padding:1px 10px}
.sv-sub{color:var(--soft); font-size:14px; margin:2px 0 10px}
.sv-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.sv-list li{border-top:2px dashed var(--rule); padding-top:12px}
.sv-list li:first-child{border-top:0; padding-top:0}
.sv-top{display:flex; gap:8px; align-items:baseline; min-width:0}
.sv-code{font-family:var(--f-play); font-weight:800; color:var(--uc); flex:none}
.sv-title{min-width:0; line-height:1.3}
.sv-lab{display:block; font-size:13px; color:var(--soft); margin:8px 0 4px}
.sv-note{width:100%; box-sizing:border-box; font:inherit; font-size:15px; color:var(--ink2); background:var(--pg); border:2px solid var(--rule); border-radius:12px; padding:8px 10px; resize:vertical}
.sv-btns{display:flex; gap:8px; margin-top:8px}
.sv-btns .bigbtn{font-size:16px; padding:9px 12px; box-shadow:0 3px 0 color-mix(in srgb, var(--go) 60%, #000)}
.sv-btns .bigbtn.ghost{flex:0 0 auto; width:auto; box-shadow:0 3px 0 var(--rule)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(92px + env(safe-area-inset-bottom,0px)); z-index:65; background:var(--ink2); color:var(--pg); font-family:var(--f-play); font-weight:700; font-size:15px; padding:10px 16px; border-radius:14px; max-width:calc(100vw - 32px); box-shadow:0 6px 20px rgba(0,0,0,.25)}
</style>

<div class="wrapx" id="home"></div>

<div class="player" id="player" hidden>
  <div class="ptop"><button class="xbtn" id="pclose" aria-label="Close lesson"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 4l12 12M16 4L4 16"/></svg></button>
    <div class="pbar"><i id="pfill"></i></div><span class="pcount" id="pcount"></span><button class="bdtoggle savebtn" id="psave" type="button" aria-pressed="false" aria-label="Save this lesson to revisit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg><span class="sv-t">Save</span></button><button class="bdtoggle" id="pboard" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21l4-4 4 4M7 9h6M7 12h9" stroke-linecap="round"/></svg>Board</button></div>
  <div class="plabel" id="plabel"></div>
  <div class="pbody" id="pbody"><div class="pin" id="pin"></div></div>
  <div class="pfoot"><div class="fin"><button class="bigbtn ghost back" id="pback" type="button">Back</button><button class="bigbtn" id="pnext" type="button">Next</button></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="lb2" id="lb2" hidden><img alt=""></div>

<script>window.DATA=/*DATA*/;window.CFG=/*CFG*/;</script>
<script>
(function(){
const D = window.DATA, LECS = D.lecs;
const CFG = window.CFG; // exam date, day plan and names come from courses/<name>/course.py
const EXAM = new Date(CFG.exam);
const PLAN = CFG.plan.map(p=>{ const [y,m,d] = p.date.split('-').map(Number); return Object.assign({}, p, {d:new Date(y, m-1, d)}); });
const KEY = CFG.slug + '-lessonpath-v1';
let S = {done:{}, xp:0, ticks:{}, review:[], boss:{}, days:[], saved:{}};
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
function skey(lid, i){ return lid + '-' + (i==='boss' ? 'boss' : i); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uc = id => `var(--u${id.slice(1)})`;
const lkey = (lid, i) => lid + '-' + i;

/* ---------- icons ---------- */
const ICON = {
  bolt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  mark:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>',
  crown:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></svg>'
};
function medal(color, locked, label){
  const c = locked ? 'var(--rule)' : color;
  return `<svg viewBox="0 0 120 120" role="img" aria-label="${esc(label)}"><path d="M38 6h18l-8 34H30z" fill="${c}" opacity=".75"/><path d="M82 6H64l8 34h18z" fill="${c}" opacity=".75"/>
  <circle cx="60" cy="72" r="40" fill="${c}"/><circle cx="60" cy="72" r="31" fill="none" stroke="#fff" stroke-width="4" opacity="${locked?.5:.9}"/>
  <path d="M60 52l6.5 13.5 14.5 2-10.5 10 2.6 14.5L60 85l-13.1 7 2.6-14.5-10.5-10 14.5-2z" fill="#fff" opacity="${locked?.55:1}"/></svg>`;
}
function ring(p){ const r=22, C=2*Math.PI*r; return `<svg class="ring" viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="6"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 26 26)"/><text x="26" y="31" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="14" fill="#fff">${Math.round(p*100)}%</text></svg>`; }

/* ---------- progress helpers ---------- */
function lecProg(L){ const n = L.lessons.length + 1; let d = L.lessons.filter((x,i)=>S.done[lkey(L.id,i)]).length + (S.boss[L.id]?1:0); return d/n; }
function nextLesson(){
  for(const L of LECS){ for(let i=0;i<L.lessons.length;i++) if(!S.done[lkey(L.id,i)]) return [L.id,i]; if(!S.boss[L.id]) return [L.id,'boss']; }
  return null;
}
function todayIdx(){ const t=new Date(); t.setHours(0,0,0,0); for(let i=0;i<PLAN.length;i++){ const d=new Date(PLAN[i].d); if(d.getTime()===t.getTime()) return i; } return t < PLAN[0].d ? 0 : -1; }
function dayProg(P){ let tot=0, d=0; P.lecs.forEach(id=>{ if(id==='review'){ return; } const L=LECS.find(x=>x.id===id); tot += L.lessons.length+1; d += L.lessons.filter((x,i)=>S.done[lkey(id,i)]).length + (S.boss[id]?1:0); }); return tot ? d/tot : 0; }

/* ---------- saved lessons ---------- */
function savedList(){
  return Object.entries(S.saved||{}).map(([k,v])=>{ const m=k.match(/^(l\d+)-(boss|\d+)$/); if(!m) return null; const L=LECS.find(x=>x.id===m[1]); if(!L) return null;
    const i = m[2]==='boss' ? 'boss' : +m[2]; if(i!=='boss' && !L.lessons[i]) return null; return {k, v, L, i}; }).filter(Boolean).sort((a,b)=>b.v.at-a.v.at);
}
function savedHTML(){
  const list = savedList(); if(!list.length) return '';
  return `<section class="savedbox"><h2>Saved to revisit <span>${list.length}</span></h2><p class="sv-sub">Lessons you flagged. Open one to jump back to the screen you saved it on.</p><ul class="sv-list">` +
    list.map(({k,v,L,i})=>{ const title = i==='boss' ? 'Boss level: ' + L.badge : `Lesson ${i+1} · ${L.lessons[i].title}`;
      return `<li style="--uc:${uc(L.id)}"><div class="sv-top"><span class="sv-code">${L.code}</span><b class="sv-title">${esc(title)}</b></div>
      <label class="sv-lab" for="svn-${k}">What's confusing? (optional)</label><textarea class="sv-note" id="svn-${k}" data-k="${k}" rows="2" placeholder="e.g. why does Gβγ open the K+ channel and not Gα?">${esc(v.note||'')}</textarea>
      <div class="sv-btns"><button type="button" class="bigbtn sv-open" data-k="${k}">Open at screen ${(v.k||0)+1}</button><button type="button" class="bigbtn ghost sv-del" data-k="${k}">Remove</button></div></li>`; }).join('') + `</ul></section>`;
}
function openSaved(k){
  const m = k.match(/^(l\d+)-(boss|\d+)$/); if(!m) return; const s = S.saved[k];
  open(m[1], m[2]==='boss' ? 'boss' : +m[2]);
  if(s && s.k){ P.k = Math.min(s.k, P.steps.filter(x=>x.t!=='reward').length-1); show(); }
}
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>{ el.hidden=true; }, 2600); }
$('#psave').addEventListener('click', ()=>{
  if(!P || P.i==='review' || P.i==='sheet') return;
  const k = skey(P.L.id, P.i); S.saved = S.saved || {};
  if(S.saved[k]){ delete S.saved[k]; toast('Removed from Saved to revisit'); }
  else { S.saved[k] = {k: P.board ? 0 : P.k, at: Date.now(), note: ''}; toast('Saved. It is on the home screen under Saved to revisit.'); }
  save(); syncSave();
});
function syncSave(){ const b=$('#psave'); if(!P){ return; } const hide = (P.i==='review'||P.i==='sheet'); b.hidden = hide; if(hide) return;
  const on = !!(S.saved && S.saved[skey(P.L.id, P.i)]); b.setAttribute('aria-pressed', on?'true':'false'); b.querySelector('.sv-t').textContent = on ? 'Saved' : 'Save';
  b.setAttribute('aria-label', on ? 'Remove this lesson from Saved to revisit' : 'Save this lesson to revisit'); }

/* ---------- home ---------- */
function isClosed(L, p){ const o = S.open && S.open[L.id]; if(o === true) return false; if(o === false) return true; return p >= 1; }
function renderHome(){
  const days = Math.max(0, Math.ceil((EXAM - new Date())/86400000));
  const totalL = LECS.reduce((a,L)=>a+L.lessons.length+1,0), doneL = Object.keys(S.done).length + Object.keys(S.boss).length;
  const ti = todayIdx(), nl = nextLesson();
  let h = `<p class="tag" style="--uc:var(--u5)">${esc(CFG.eyebrow)}</p>
  <h1 class="app">Lesson Path</h1><p class="sub2">Small lessons, one idea per screen. Finish a lesson, earn stars. Finish a lecture, earn its badge.</p>
  <div class="stats"><span class="pill cd">${ICON.clock}<b>${days}</b>&nbsp;days to the exam</span><span class="pill xp">${ICON.bolt}<b>${S.xp}</b>&nbsp;XP</span><span class="pill done">${ICON.check}<b>${doneL}</b>/${totalL}&nbsp;lessons</span></div>`;
  const P = ti>=0 ? PLAN[ti] : null;
  h += `<section class="today"><h2>${P ? "Today's mission: " + P.name : 'Final stretch'}</h2><p class="daydesc">${P ? P.desc : 'Clear anything left on the path, then hit your review pile.'}</p><div class="days">` +
    PLAN.map((p,i)=>`<div class="day ${i===ti?'now':''}"><span class="dn">${p.name}</span>${p.lecs.map(x=>x==='review'?'Review':LECS.find(L=>L.id===x).code).join(' + ')}<div class="bar"><i style="width:${Math.round(dayProg(p)*100)}%"></i></div></div>`).join('') +
    `</div>` + (nl ? `<button class="bigbtn" id="cont">Continue<small>${esc(nl[1]==='boss' ? LECS.find(L=>L.id===nl[0]).code + ' boss level' : LECS.find(L=>L.id===nl[0]).code + ': ' + LECS.find(L=>L.id===nl[0]).lessons[nl[1]].title)}</small></button>` : `<button class="bigbtn" disabled>Every lesson done. You're ready.</button>`) +
    `<div class="row2"><button class="bigbtn ghost" id="rev">Review pile<small>${S.review.length} card${S.review.length===1?'':'s'} to fix</small></button><a class="bigbtn ghost" href="${esc(CFG.guideUrl)}" target="_blank" rel="noopener" style="text-decoration:none;text-align:center">Full guide<small>3D models and Pathway Lab</small></a></div></section>`;
  h += savedHTML();
  LECS.forEach(L=>{
    const p = lecProg(L), color = uc(L.id); let nxt = nl && nl[0]===L.id ? nl[1] : null;
    const closed = isClosed(L, p);
    h += `<section class="unit ${closed?'closed':''}" style="--uc:${color}"><div class="unit-hd" role="button" tabindex="0" aria-expanded="${closed?'false':'true'}" data-tog="${L.id}" aria-label="${closed?'Show':'Hide'} ${L.code} lessons">${ring(p)}<div class="meta"><h3>${L.code} ${esc(L.name)}</h3><p>${esc(L.tag)} · ${L.lessons.length} lessons + boss</p><button class="bdlink" data-bd="${L.id}">Board cheat sheet</button></div><div class="badge-mini">${medal('#ffffff33', !S.boss[L.id], L.badge)}${S.boss[L.id]?esc(L.badge):'Locked'}</div><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div><ol class="path" ${closed?'hidden':''}>`;
    let lastGroup = null;
    L.lessons.forEach((Ls,i)=>{
      if(Ls.group && Ls.group!==lastGroup){ h += `<li class="grouplab">${esc(Ls.group.replace(/^Part \d+: /,''))}</li>`; lastGroup = Ls.group; }
      const st = S.done[lkey(L.id,i)];
      h += `<li><button class="node ${st?'done':''} ${nxt===i?'next':''}" data-l="${L.id}" data-i="${i}"><span class="dot">${st?ICON.check.replace('<svg','<svg width="22" height="22"'):i+1}</span><span class="nt"><b>${esc(Ls.title)}</b><span>${Ls.cards.length} screens · ${Ls.checks.length} quick check${Ls.checks.length===1?'':'s'}${Ls.cards.some(c=>c.k==='exam')?' <i class="hot" title="On her practice set">◎ tested</i>':''}</span></span>${S.saved[skey(L.id,i)]?`<span class="mark" title="Saved to revisit">${ICON.mark}</span>`:''}${st?`<span class="stars">${'★'.repeat(st.stars)}${'☆'.repeat(3-st.stars)}</span>`:''}</button></li>`;
    });
    const bd = S.boss[L.id];
    h += `<li><button class="node boss ${bd?'done':''} ${nxt==='boss'?'next':''}" data-l="${L.id}" data-i="boss"><span class="dot">${ICON.crown.replace('<svg','<svg width="24" height="24"')}</span><span class="nt"><b>Boss level: ${esc(L.badge)}</b><span>Her question styles, practice questions, then your badge</span></span></button></li></ol></section>`;
  });
  h += `<p class="note-sm">Your progress saves in this browser on this device.</p>`;
  $('#home').innerHTML = h;
  $('#home').querySelectorAll('.node').forEach(b=>b.addEventListener('click',()=>open(b.dataset.l, b.dataset.i==='boss'?'boss':+b.dataset.i)));
  $('#home').querySelectorAll('.sv-open').forEach(b=>b.addEventListener('click',()=>openSaved(b.dataset.k)));
  $('#home').querySelectorAll('.sv-del').forEach(b=>b.addEventListener('click',()=>{ delete S.saved[b.dataset.k]; save(); renderHome(); }));
  $('#home').querySelectorAll('.sv-note').forEach(n=>n.addEventListener('input',()=>{ const s=S.saved[n.dataset.k]; if(s){ s.note=n.value; save(); } }));
  $('#home').querySelectorAll('.bdlink').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); openSheet(b.dataset.bd); }));
  $('#home').querySelectorAll('.unit-hd[data-tog]').forEach(hd=>{
    const tog = ()=>{ const id = hd.dataset.tog, sec = hd.closest('.unit'), now = !sec.classList.contains('closed');
      S.open = S.open || {}; S.open[id] = !now; save();
      sec.classList.toggle('closed', now); sec.querySelector('.path').hidden = now;
      hd.setAttribute('aria-expanded', now ? 'false' : 'true'); hd.setAttribute('aria-label', (now?'Show ':'Hide ') + id.toUpperCase() + ' lessons'); };
    hd.addEventListener('click', tog);
    hd.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); tog(); } });
  });
  const c = $('#cont'); if(c) c.addEventListener('click',()=>open(nl[0], nl[1]));
  $('#rev').addEventListener('click', openReview);
}

/* ---------- glossary tap-to-define ---------- */
const GL = D.gloss; const gmap = {}; const keys = [];
GL.forEach((g,gi)=>g.m.forEach(m=>{ gmap[m]=gi; keys.push(m); }));
keys.sort((a,b)=>b.length-a.length);
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const W = 'A-Za-z0-9Ͱ-Ͽ';
const gre = new RegExp(`(?<![${W}-])(${keys.map(reEsc).join('|')})(?![${W}])`, 'g');
let seen = new Set();
function linkTerms(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){
    const p = n.parentElement; if(!p || p.closest('svg,button,a,.term,code,table,.kick,.ltitle')) return NodeFilter.FILTER_REJECT; return NodeFilter.FILTER_ACCEPT; }});
  const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const t = n.nodeValue; gre.lastIndex = 0; let m, last = 0, frag = null;
    while((m = gre.exec(t))){
      const gi = gmap[m[1]]; if(gi===undefined || seen.has(gi)) continue;
      seen.add(gi); frag = frag || document.createDocumentFragment();
      frag.appendChild(document.createTextNode(t.slice(last, m.index)));
      const b = document.createElement('button'); b.type='button'; b.className='term'; b.dataset.g = gi; b.textContent = m[1]; frag.appendChild(b); last = m.index + m[1].length;
    }
    if(frag){ frag.appendChild(document.createTextNode(t.slice(last))); n.parentNode.replaceChild(frag, n); }
  });
}
let gpop = null;
document.addEventListener('click', e=>{
  const b = e.target.closest('.term');
  if(gpop && !e.target.closest('.gpop')){ gpop.remove(); gpop = null; }
  if(!b) return;
  const g = GL[+b.dataset.g]; gpop = document.createElement('div'); gpop.className='gpop';
  gpop.innerHTML = `<p class="gpop-t">${esc(g.t)}</p><p>${esc(g.d)}</p>`; document.body.appendChild(gpop);
  const r = b.getBoundingClientRect(), vw = document.documentElement.clientWidth, pw = Math.min(330, vw-24);
  gpop.style.position='fixed'; gpop.style.width = pw+'px'; gpop.style.left = Math.max(12, Math.min(r.left, vw-pw-12))+'px';
  const below = r.bottom + 8; gpop.style.top = (below + 160 > window.innerHeight ? Math.max(12, r.top - 8 - gpop.offsetHeight) : below) + 'px';
  e.stopPropagation();
});

/* ---------- player ---------- */
let P = null;
function buildSteps(L, i){
  const steps = [];
  if(i==='boss'){
    steps.push({t:'bossintro'});
    L.boss_cards.forEach(c=>steps.push({t:'card', c}));
    L.boss_q.forEach(q=>steps.push({t:'prac', q}));
    const pool = L.lessons.flatMap(x=>x.checks); const pick = pool.slice().sort(()=>Math.random()-.5).slice(0,6);
    pick.forEach(c=>steps.push({t:'cloze', c}));
    steps.push({t:'bossend'});
  } else {
    const Ls = L.lessons[i];
    steps.push({t:'mission'});
    Ls.cards.forEach(c=>steps.push({t:'card', c}));
    Ls.checks.forEach(c=>steps.push({t:'cloze', c}));
    steps.push({t:'ican'});
  }
  return steps;
}
function open(lid, i){
  const L = LECS.find(x=>x.id===lid);
  P = {L, i, steps: buildSteps(L,i), k:0, got:0, asked:0, answered:{}};
  seen = new Set();
  $('#player').style.setProperty('--uc', uc(lid));
  $('#player').hidden = false; document.body.style.overflow='hidden';
  try{ history.replaceState(null,'', '#' + lid + (i==='boss'?'-boss':'-'+i)); }catch(e){}
  show();
}
function close(){ $('#player').hidden = true; document.body.style.overflow=''; P = null; try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} renderHome(); }
$('#pclose').addEventListener('click', close);
$('#pback').addEventListener('click', goBack);
document.addEventListener('keydown', e=>{ if(!P || $('#player').hidden || e.target.closest('input,select,textarea')) return;
  const np = e.code==='Numpad4' ? 'f' : (e.code==='Numpad1' ? 'b' : null);
  const fwd = np ? np==='f' : (e.key==='ArrowRight' || e.key===' ' || e.code==='Space' || e.key==='4');
  const bwd = np ? np==='b' : (e.key==='ArrowLeft' || e.key==='1');
  if(e.target.closest('button') && (e.key===' ')) { e.preventDefault(); }
  if(bwd){ e.preventDefault(); goBack(); return; }
  if(fwd){ e.preventDefault();
    if(P.board){ goNext(); return; }
    const st = P.steps[P.k];
    if(st.t==='cloze' && !P.answered[P.k]){ const b = document.querySelector('#pin .blank:not(.shown)'); if(b) b.click(); return; }
    goNext(); } });
(function(){ let sx=null, sy=null; const el=document.getElementById('pbody');
  el.addEventListener('touchstart', e=>{ if(P && !P.board){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; } }, {passive:true});
  el.addEventListener('touchend', e=>{ if(sx===null||!P||P.board) { sx=null; return; } const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
    if(Math.abs(dx)>80 && Math.abs(dx)>Math.abs(dy)*1.5 && !e.target.closest('.tbl,.bd-tblw,iframe')){ if(dx>0) goBack(); else if(!(P.steps[P.k].t==='cloze' && !P.answered[P.k])) goNext(); } }, {passive:true}); })();
document.querySelector('.pbar').addEventListener('click', e=>{ if(!P || P.board) return; const r=e.currentTarget.getBoundingClientRect();
  const steps=P.steps.filter(s=>s.t!=='reward').length; const k=Math.max(0, Math.min(steps-1, Math.round((e.clientX-r.left)/r.width*(steps-1))));
  P.k=k; show(); });

const BD = D.boards || {};

function blockHTML(c){

      return kick + `<div class="bd-fig"><p class="bd-h b">Sketch this</p>${im?`<img src="${im.getAttribute('src')}" alt="">`:(sv?sv.outerHTML:'')}${cap?`<p class="bd-cap">${esc(cap.textContent.trim())}</p>`:''}</div>`; }

function blockWeight(c){ if(c.k==='fig') return 140; if(c.k==='table') return 40 + plain(c.h).split(/\s+/).length; return 14 + plain(c.h).split(/\s+/).length; }
function lessonPages(L, Ls){

function pagerHTML(n, k){
  return `<div class="bd-pager"><button type="button" class="bd-nav" data-d="-1" ${k===0?'disabled':''} aria-label="Previous board page">‹</button><div class="bd-dots">${Array.from({length:n},(_,i)=>`<button type="button" class="bd-dot ${i===k?'on':''}" data-p="${i}" aria-label="Board page ${i+1}"></button>`).join('')}</div><span class="bd-pc">Page ${k+1} of ${n}</span><button type="button" class="bd-nav" data-d="1" ${k===n-1?'disabled':''} aria-label="Next board page">›</button></div>`;
}

function lectureSheet(L){
  const pws = (BD[L.id]||[]);
  let rows = '';
  if(L.onepage){ const d=document.createElement('div'); d.innerHTML=L.onepage;
    d.querySelectorAll('tbody tr').forEach(tr=>{ const td=[...tr.children].map(x=>x.textContent.trim());
      rows += `<div class="bd-row"><span>${esc(td[0]||'')}</span><span class="bd-b">${esc(td[1]||'')}</span><span class="bd-g">${esc(td[2]||'')}</span></div>`; }); }
  return `<p class="bd-tip">Your ${esc(L.code)} cheat sheet, board style. Two boards' worth: pathways first, then the summary.</p>
  <div class="board"><h2 class="bd-t">${esc(L.code)} ${esc(L.name)}: pathways to draw</h2><div class="bd-grid">${pws.map(pwHTML).join('')}</div></div>
  <div class="board"><h2 class="bd-t">${esc(L.code)} on one board</h2><div class="bd-row" style="border-top:0"><span class="bd-h">Part</span><span class="bd-h b">What it does</span><span class="bd-h g">Trick</span></div>${rows}</div>`;
}
function openSheet(lid){
  const L = LECS.find(x=>x.id===lid);
  P = {L, i:'sheet', steps:[{t:'sheet'}], k:0, got:0, answered:{}, board:true};
  $('#player').style.setProperty('--uc', uc(lid)); $('#player').hidden=false; document.body.style.overflow='hidden'; show();
}
$('#pboard').addEventListener('click', ()=>{ if(!P || P.i==='review' || P.i==='sheet') return; P.board = !P.board; P.bp = 0; show(); });

/* ---------- confetti ---------- */
function confetti(big){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'); const dpr = window.devicePixelRatio||1;
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.scale(dpr,dpr);
  const cols = ['#16a34a','#f5a524','#0e8fb0','#d6338a','#7c4ddb','#e4572e','#2f6fe4'];
  const N = big ? 220 : 110; const ps = [];
  for(let i=0;i<N;i++) ps.push({x:innerWidth/2 + (Math.random()-.5)*120, y:innerHeight*0.35, vx:(Math.random()-.5)*(big?16:11), vy:-Math.random()*(big?16:12)-4, r:Math.random()*6+4, c:cols[i%cols.length], a:Math.random()*6, s:(Math.random()-.5)*.3});
  let t = 0; (function f(){ ctx.clearRect(0,0,innerWidth,innerHeight); t++;
    ps.forEach(p=>{ p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.s; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66); ctx.restore(); });
    if(t < 150) requestAnimationFrame(f); else ctx.clearRect(0,0,innerWidth,innerHeight); })();
}

renderHome();
const hm = (location.hash||'').match(/^#(l\d+)-(boss|\d+)$/);
if(hm){ const L = LECS.find(x=>x.id===hm[1]); if(L) open(hm[1], hm[2]==='boss'?'boss':Math.min(+hm[2], L.lessons.length-1)); }
})();
</script>
